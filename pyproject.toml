[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LuBan-Meter"
version = "0.1.0"
description = "Modular benchmark toolkit for multiple AI hardware environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "croniter>=6,<7",
  "filelock>=3.16,<4",
  "tzlocal>=5,<6",
]

[project.optional-dependencies]
generation = ["Faker>=30", "transformers>=4.45,<6", "jinja2>=3.1"]
quality = ["jieba>=0.42", "rouge-chinese>=1.0"]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[project.scripts]
luban-meter = "luban_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luban_meter = [
  "reporting/template.html",
  "reporting/requests.js",
  "reporting/case_analysis.js",
  "reporting/report_overview.js",
  "reporting/summary_cards.js",
  "reporting/resources.js",
  "benchmarking/**/sandbox_runner.py",
  "benchmarking/**/Containerfile",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E = pycodestyle errors (PEP 8)
# F = pyflakes (unused imports, undefined names, etc.)
# W = pycodestyle warnings
# I = isort (import ordering)
# N = PEP 8 naming conventions
select = ["E", "F", "W", "I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["luban_meter"]
