[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LuBan-Meter"
version = "0.1.0"
description = "Modular benchmark toolkit for multiple AI hardware environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
luban-meter = "luban_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luban_meter = [
  "benchmark/**/benchmark.py",
  "benchmark/**/result.py",
  "benchmark/**/*.yaml",
  "benchmark/inference/data/**/*.jsonl",
  "benchmark/inference/data/**/*.json",
  "suite/definitions/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
