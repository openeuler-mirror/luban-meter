[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LuBan-Meter"
version = "0.1.0"
description = "Modular benchmark toolkit for multiple AI hardware environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[project.scripts]
luban-meter = "luban_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luban_meter = [
  "benchmarking/**/collect_raw.py",
  "benchmarking/**/calculate_metrics.py",
  "benchmarking/**/executor.py",
  "benchmarking/**/sandbox_runner.py",
  "benchmarking/**/Containerfile",
  "benchmarking/**/*.yaml",
  "benchmarking/model_service_quality/data/**/*.jsonl",
  "benchmarking/model_service_quality/data/**/*.json",
  "benchmarking/model_service_quality/data/**/LICENSE*",
  "suite/definitions/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E = pycodestyle errors (PEP 8)
# F = pyflakes (unused imports, undefined names, etc.)
# W = pycodestyle warnings
# I = isort (import ordering)
# N = PEP 8 naming conventions
select = ["E", "F", "W", "I", "N"]

[tool.ruff.lint.isort]
known-first-party = ["luban_meter"]
