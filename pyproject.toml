[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LuBan-Meter"
version = "0.1.0"
description = "Modular benchmark toolkit for multiple AI hardware environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[project.scripts]
luban-meter = "luban_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luban_meter = [
  "benchmark/**/benchmark.py",
  "benchmark/**/result.py",
  "benchmark/**/executor.py",
  "benchmark/**/sandbox_runner.py",
  "benchmark/**/Containerfile",
  "benchmark/**/*.yaml",
  "benchmark/inference/data/**/*.jsonl",
  "benchmark/inference/data/**/*.json",
  "benchmark/inference/data/**/LICENSE*",
  "suite/definitions/*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E = pycodestyle errors (PEP 8)
# F = pyflakes (unused imports, undefined names, etc.)
# W = pycodestyle warnings
# I = isort (import ordering)
select = ["E", "F", "W", "I"]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["luban_meter"]
