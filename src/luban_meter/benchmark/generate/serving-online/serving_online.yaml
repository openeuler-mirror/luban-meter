# OpenAI-compatible completion service.
service_url: http://127.0.0.1:8000
api_key: ""
request_timeout: 120

# Workload mode: "random" or "dataset"
# - random:  exact-length token-ID prompts via /v1/completions
# - dataset: real conversational prompts via /v1/chat/completions
workload_mode: random

# ── Common parameters ───────────────────────────────────────────────────
warmup: 2
rounds: 100
request_rates: [1.0, 4.0, 16.0]
max_concurrency: 128
seed: 0

# ── random mode parameters ──────────────────────────────────────────────
# Encoded by the service /tokenize endpoint, then repeated and truncated
# at token-ID level to construct each exact input length.
seed_prompt: "Please summarize the benefits of open source software."
input_lengths: [128, 512, 2048]
output_lengths: [1, 32, 128]
# Fixed exact-length semantics. Changing these values is rejected.
temperature: 0.0
ignore_eos: true

# ── dataset mode parameters ─────────────────────────────────────────────
# Dataset format: "sharegpt" or "jsonl"
# - sharegpt: ShareGPT JSON with conversations array
# - jsonl:    Custom JSONL, each line has a "prompt" field (or set
#             prompt_field to use a different key)
# dataset_format: sharegpt
# prompt_field: prompt  # only for jsonl format
#
# Available datasets:
#   ShareGPT (JSON):
#     A 200-conversation sample is included at
#     dataset/sharegpt/ShareGPT_V3_sample.json
#     Full dataset (~90K, 641 MB) can be downloaded from:
#       wget -O dataset/sharegpt/ShareGPT_V3_unfiltered_cleaned_split.json \
#         https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json
#
#   Custom JSONL:
#     Each line: {"prompt": "your prompt text"}
#     Example:
#       {"prompt": "What is the capital of India?"}
#       {"prompt": "Explain quantum computing."}
#
# dataset_path: dataset/sharegpt/ShareGPT_V3_sample.json
# dataset_format: sharegpt
# num_prompts: 200
# Arrival process: "poisson" | "gamma" | "constant"
# arrival_process: gamma
# burstiness: 1.0  # < 1 → more bursty, > 1 → more uniform
# max_tokens: 2048

# ── Optional Service Level Objective block ──────────────────────────────
#   Per-request SLO dimensions for Goodput computation.
#   A request is SLO-satisfied only when ALL configured dimensions are
#   within their thresholds (AND relation).
#
#   ttft_ms  — Requests with TTFT above this value are SLO-violated.
#   tpot_ms  — Requests with TPOT above this value are SLO-violated.
#              TPOT = e2el / output_tokens (includes first token).
#              Skipped for output_tokens == 1.
#   e2el_ms  — Requests with E2EL above this value are SLO-violated.
#
# slo:
#   ttft_ms: 500
#   tpot_ms: 50
#   e2el_ms: 8000

# ── Optional circuit breaker ───────────────────────────────────────────
#   Case-level stop: after each Case, if P99 E2EL exceeds this threshold,
#   subsequent Cases are skipped. Requires >= 10 successful samples.
#   Independent of SLO. Can be a number or an object:
#
# circuit_breaker: 2000
# circuit_breaker:
#   p99_e2el_ms: 2000

# ── Optional stop constraints ──────────────────────────────────────────
#   max_duration:  stop cases when a case exceeds this duration (seconds)
#   max_error_rate: stop cases when a case's error rate exceeds this ratio
#
# max_duration: 300
# max_error_rate: 0.3
