# Each offline matrix cell is warmed up independently before formal collection.
warmup_rounds: 2
rounds: 10

# The benchmark runs every input/output/request-batch combination.
input_lengths: [128, 512, 2048, 8192]
output_lengths: [1, 32, 128]
request_batch_sizes: [1, 4, 8]

# Repeated and truncated at token-ID level to create exact input lengths.
seed_prompt: "Please summarize the benefits of open source software."

# Fixed measurement semantics. Changing these values is rejected.
temperature: 0.0
ignore_eos: true
seed: 0

# Optional vLLM Engine-internal SLO thresholds for Engine Goodput.
#
# These thresholds use RequestOutput.metrics timestamps and do not include
# HTTP, API-server, network, or client-side queueing time. A request contributes
# to Engine Goodput only when every applicable configured threshold is met.
# mean_decode_step_latency_ms is not applicable when output_length == 1.
#
# engine_slo:
#   internal_ttft_ms: 500
#   prefill_latency_ms: 500
#   mean_decode_step_latency_ms: 50
#   engine_execution_latency_ms: 8000

# vLLM engine options.
tensor_parallel_size: 1
gpu_memory_utilization: 0.9
dtype: auto
trust_remote_code: false
enforce_eager: false

# Optional. Keep null to use the model default.
max_model_len: null
