# OpenAI-compatible model service.
service_url: http://127.0.0.1:8000
api_key: ""
request_timeout: 60

# Dataset loading and deterministic sampling. Local jsonl only.
dataset_path: data/lcsts/test.jsonl
split: test
max_samples: 5
shuffle: false
seed: 42
few_shot_path: ""
few_shot: 0

# Evaluation protocol. LCSTS is generation-only; gen mode.
eval_mode: gen
prompt_format: chat     # chat | base
prompt_version: lcsts-v1
prompt_template: "阅读以下文章，并给出简短的摘要：{content}\n摘要如下："

# Generation parameters.
max_tokens: 512
stop: []

# Client-side safety cap for simultaneous requests.
max_concurrency: 8
