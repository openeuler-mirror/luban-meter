<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuBan-Meter评测报告</title>
<style>
:root{color-scheme:light;--bg:#f2f5f9;--panel:#fff;--ink:#172c45;--muted:#65758a;--line:#dce4ee;--accent:#177b84}
body.dark{color-scheme:dark;--bg:#111b2b;--panel:#1a293e;--ink:#e6edf7;--muted:#a7b7cc;--line:#35455a;--accent:#6ed6cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px}
header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}h1{font-size:32px;letter-spacing:-1px;margin:2px 0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}.number{font-size:30px;font-weight:650}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
input,select,button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}input{min-width:240px;flex:1}button{cursor:pointer}button:hover{border-color:var(--accent)}select{max-width:100%}
.table-wrap{overflow:auto;max-height:540px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:var(--panel);cursor:pointer}td.metric{min-width:290px;overflow-wrap:anywhere}td.num{font-variant-numeric:tabular-nums}svg{width:100%;min-height:230px;color:var(--muted)}.chart{overflow:auto}.badge{display:inline-block;padding:2px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:600}.empty{padding:36px;color:var(--muted);text-align:center}footer{color:var(--muted);font-size:12px;margin-bottom:20px}
@media(max-width:700px){main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}h1{font-size:25px}}
</style></head><body><main>
<header><div><div class="eyebrow">LUBAN-METER · EVALUATION</div><h1>评测结果报告</h1><p id="subtitle" class="muted"></p></div><button id="theme">切换明暗</button></header>
<div class="cards" id="cards"></div>
<section><h2>任务与指标</h2><p class="muted">客户端、Engine内部与服务端观测分别展示。缺失值不代表零；准确率应结合覆盖率阅读。</p><div class="toolbar"><select id="task"><option value="">全部任务</option></select><select id="case"><option value="">全部Case</option></select><input id="search" placeholder="搜索指标、任务或Case" aria-label="搜索指标"></div><div class="table-wrap"><table><thead><tr><th data-sort="task">任务</th><th data-sort="case">Case</th><th data-sort="metric">指标 ↕</th><th data-sort="value">数值 ↕</th><th>单位</th><th>样本数</th></tr></thead><tbody id="rows"></tbody></table></div><p id="rowCount" class="muted"></p></section>
<section><h2>同类Case指标比较</h2><select id="metric" aria-label="比较指标"></select><div id="comparison" class="chart"></div><p class="muted">只比较同一类别、同一指标路径和单位；横轴为任务/Case。</p></section>
<section><h2>附加观测时间线</h2><select id="series" aria-label="观测序列"></select><div id="observation" class="chart"></div><p class="muted">按实际采样时间展示。每Case图表最多使用500个采样点；完整原始记录单独保存。任务详情最多列出20条观测错误，完整信息见原始结果。</p></section>
<section><h2>执行条件、覆盖率与诊断</h2><div id="details"></div></section>
<footer>离线单文件报告 · 无外部脚本或网络依赖 · 可从保存的新结果重新导出</footer>
</main><script type="application/json" id="report-data">__REPORT_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent),R=D.result;
const tasks=R.kind==='run'?R.tasks:[R];const $=id=>document.getElementById(id);
const names={success:'成功',partial_failed:'部分失败',failed:'失败',interrupted:'已中断',skipped:'未执行',discarded:'已丢弃（采集未完成）'};
const fmt=v=>v==null?'—':typeof v==='number'?Number(v.toPrecision(7)).toLocaleString('zh-CN',{maximumFractionDigits:7}):String(v);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
$('subtitle').textContent=(R.id||R.name)+' · '+(names[R.status]||R.status);
const cases=tasks.flatMap(t=>t.cases||[]),complete=cases.reduce((n,c)=>n+(c.coverage?.complete||0),0),selected=cases.reduce((n,c)=>n+(c.coverage?.selected||0),0);
for(const [label,value] of [['任务数',tasks.length],['Case数',cases.length],['完成样本',complete],['样本完成比例',selected?(100*complete/selected).toFixed(1)+'%':'—']]){const c=el('div',undefined,'card');c.append(el('div',label,'muted'),el('div',value,'number'));$('cards').append(c)}
function option(parent,value,text){const o=el('option',text);o.value=value;parent.append(o)}
for(const t of tasks)option($('task'),t.name,t.name+' · '+(names[t.status]||t.status));
for(const c of [...new Set(cases.map(c=>c.id))])option($('case'),c,c);
let sort='metric',ascending=true;
function visibleRows(){const q=$('search').value.toLowerCase();return D.rows.filter(r=>(!$('task').value||r.task===$('task').value)&&(!$('case').value||r.case===$('case').value)&&[r.metric,r.task,r.case].join(' ').toLowerCase().includes(q))}
function render(){let rows=visibleRows();rows.sort((a,b)=>{const x=a[sort],y=b[sort];return(typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??'')))*(ascending?1:-1)});$('rows').replaceChildren();for(const r of rows){const tr=el('tr');for(const key of ['task','case','metric','value','unit','count'])tr.append(el('td',fmt(r[key]),key==='metric'?'metric':'num'));$('rows').append(tr)}$('rowCount').textContent=rows.length+'项指标';const prior=$('metric').value;$('metric').replaceChildren();for(const key of [...new Set(rows.map(r=>JSON.stringify([r.category,r.metric,r.unit])))])option($('metric'),key,JSON.parse(key).join(' · '));if([...$('metric').options].some(o=>o.value===prior))$('metric').value=prior;comparison()}
function svgElement(tag,attrs){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
function chart(id,points,line=false){const box=$(id);box.replaceChildren();points=points.filter(p=>typeof p.value==='number'&&Number.isFinite(p.value));if(!points.length){box.append(el('div','没有可展示的数据','empty'));return}const width=Math.max(700,line?700:points.length*80),height=300,pad=50,values=points.map(p=>p.value),lo=Math.min(0,...values),hi=Math.max(1,...values),scale=v=>height-pad-(v-lo)/(hi-lo)*(height-pad*2);const svg=svgElement('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':line?'观测时间线':'Case指标比较'});const minTime=points[0].time,maxTime=points.at(-1).time;const x=(p,i)=>line?pad+(p.time-minTime)/Math.max(1e-9,maxTime-minTime)*(width-pad*2):pad+(i+.5)*(width-pad*2)/points.length;for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=scale(v);svg.append(svgElement('line',{x1:pad,y1:y,x2:width-pad,y2:y,stroke:'var(--line)'}));const text=svgElement('text',{x:4,y:y+4,fill:'currentColor','font-size':11});text.textContent=fmt(v);svg.append(text)}if(line)svg.append(svgElement('polyline',{points:points.map((p,i)=>`${x(p,i)},${scale(p.value)}`).join(' '),fill:'none',stroke:'var(--accent)','stroke-width':2}));points.forEach((p,i)=>{const px=x(p,i),y=scale(p.value);const mark=line?svgElement('circle',{cx:px,cy:y,r:3,fill:'var(--accent)'}):svgElement('rect',{x:px-15,y:Math.min(y,scale(0)),width:30,height:Math.max(1,Math.abs(scale(0)-y)),rx:3,fill:'var(--accent)'});const title=svgElement('title',{});title.textContent=p.label+': '+fmt(p.value);mark.append(title);svg.append(mark);if(!line||i===0||i===points.length-1){const t=svgElement('text',{x:px,y:height-12,'text-anchor':'middle',fill:'currentColor','font-size':10});t.textContent=p.label;svg.append(t)}});box.append(svg)}
function comparison(){const key=$('metric').value;chart('comparison',visibleRows().filter(r=>JSON.stringify([r.category,r.metric,r.unit])===key).map(r=>({value:r.value,label:r.task+'/'+r.case})))}
const series=new Map();for(const s of D.observations){const k=[s.task,s.case,s.metric,JSON.stringify(s.labels)].join(' · ');if(!series.has(k))series.set(k,[]);series.get(k).push({value:s.value,time:s.time,label:new Date(s.time*1000).toLocaleTimeString()})}for(const key of series.keys())option($('series'),key,key);function observation(){chart('observation',series.get($('series').value)||[],true)}
for(const task of tasks){const section=el('details');section.append(el('summary',task.name+' · '+task.scenario+' · '+(names[task.status]||task.status)));for(const c of task.cases||[]){const detail=el('details');detail.append(el('summary',c.id+' · '+(names[c.status]||c.status)));const info={parameters:c.parameters,reason:c.reason,collection_complete:c.collection_complete,metrics_status:c.metrics_status,device_observation:c.device_observation,coverage:c.coverage,window:c.window,observation:c.observation?{status:c.observation.status,valid_samples:c.observation.valid_samples,failed_samples:c.observation.failed_samples,actual_window_s:c.observation.actual_window_s,failures:c.observation.failure_examples}:undefined,error:c.error,cleanup_error:c.cleanup_error,metrics:c.metrics,metric_errors:Object.fromEntries(Object.entries(c.metrics||{}).filter(([k,v])=>v.error)),raw:c.raw};detail.append(el('pre',JSON.stringify(info,null,2)));section.append(detail)}if(task.errors)section.append(el('pre',JSON.stringify(task.errors,null,2)));$('details').append(section)}
$('theme').onclick=()=>document.body.classList.toggle('dark');for(const id of ['task','case','search'])$(id).addEventListener('input',render);$('metric').onchange=comparison;$('series').onchange=observation;document.querySelectorAll('[data-sort]').forEach(n=>n.onclick=()=>{ascending=sort===n.dataset.sort?!ascending:true;sort=n.dataset.sort;render()});render();observation();
</script></body></html>
